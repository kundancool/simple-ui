name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: simple-ui/package-lock.json
      - run: npm ci
        working-directory: simple-ui
      - run: npm run build
        working-directory: simple-ui
      - run: npm test
        working-directory: simple-ui
      - run: npm run build:docs
        working-directory: simple-ui
      - run: npm install --no-audit --no-fund && npm run build
        working-directory: simple-ui/mcp
